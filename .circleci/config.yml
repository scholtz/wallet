version: 2.1

workflows:
  build:
    jobs:
      - test-job

jobs:
  test-job:
    docker:
      - image: cimg/node:26.0.0-browsers  # Use image with browsers for Playwright
    steps:
      - checkout
      - run:
          name: Install pnpm
          command: npm install -g pnpm@11.10.0
      - run:
          name: Install dependencies
          command: pnpm install --frozen-lockfile
      - run:
          name: Build application
          command: pnpm run build
      - run:
          name: Install Playwright browser
          command: pnpm exec playwright install --with-deps chromium
      - run:
          name: Run unit and E2E tests
          command: STEP_DELAY_MS=0 pnpm run test
      - store_artifacts:
          path: playwright-report
      - store_artifacts:
          path: test-results
