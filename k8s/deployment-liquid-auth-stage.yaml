# Liquid Auth service for Biatec Wallet — STAGE: https://stage.liquid.biatec.io
#
# The Algorand Foundation's Liquid Auth server (github.com/algorandfoundation/liquid-auth):
# passkey (FIDO2) authentication of wallets + WebRTC signaling between wallets and dApps.
# Stage instance for testing the wallet's "Connect → Liquid Auth" tab and dApps using
# `biatecLiquid({ origin: "https://stage.liquid.biatec.io" })` (see docs/LIQUID_AUTH.md).
#
# Why it lives under biatec.io: WebAuthn only lets wallet.biatec.io create passkeys for its own
# registrable domain, so RP ID (HOSTNAME) is `biatec.io` and ORIGIN is the stage wallet origin.
#
# Prerequisites (out of band, like `regcred` for the wallet deployments):
#   kubectl create secret generic liquid-auth-stage-secrets -n awallet \
#     --from-literal=SESSION_SECRET="$(openssl rand -hex 32)" \
#     --from-literal=DB_USERNAME=algorand \
#     --from-literal=DB_PASSWORD="$(openssl rand -hex 24)" \
#     --from-literal=REDIS_PASSWORD="$(openssl rand -hex 24)"
#   (or run k8s/liquid-auth-stage-secrets.sh stage). Applied automatically by
#   .github/workflows/liquid-auth.yml (Stage environment) on every change to this file.
#   The production twin is k8s/deployment-liquid-auth-stable.yaml (liquid.biatec.io).
#
# Image: the upstream project only publishes `ghcr.io/algorandfoundation/liquid-auth:develop`
# (no release tags yet). Pin a digest, or mirror to scholtz2/liquid-auth, before relying on it.
apiVersion: v1
kind: Namespace
metadata:
  name: awallet
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: liquid-auth-stage-conf
  namespace: awallet
data:
  NODE_ENV: "production"
  PORT: "3000"
  # FIDO2 relying party. HOSTNAME = RP ID (registrable domain of the wallet page),
  # ORIGIN = the exact origin passkeys are created from.
  RP_NAME: "Biatec Wallet (stage)"
  HOSTNAME: "biatec.io"
  # The upstream server verifies passkeys against ONE web origin, so only this stage wallet
  # host can register/use passkeys. Other stage hosts listed in the ingress CORS below can
  # still call the REST API but their passkey ceremonies will be rejected.
  ORIGIN: "https://stage.wallet.biatec.io"
  # TLS terminates at the ingress and the app does not trust the proxy, so express-session
  # must not insist on a secure connection itself; the `Secure` cookie flag is added by the
  # ingress (proxy_cookie_flags) below.
  SESSION_SECURE: "false"
  ENABLE_INDEX_PAGE: "false"
  # MongoDB (sessions, users, passkeys) and Redis (socket.io adapter + auth events)
  DB_HOST: "liquid-auth-stage-mongo-service:27017"
  DB_NAME: "liquid"
  DB_ATLAS: "false"
  REDIS_HOST: "liquid-auth-stage-redis-service"
  REDIS_PORT: "6379"
  REDIS_USERNAME: "default"
  # REDIS_PASSWORD is injected from the k8s Secret (GitHub LIQUID_AUTH_REDIS_PASSWORD),
  # not this ConfigMap. An empty password with username "default" makes ioredis
  # AUTH-retry forever, so Nest never reaches app.listen().
  # Used to resolve rekeyed accounts when verifying the account signature over the challenge.
  ALGOD_SERVER: "https://mainnet-api.4160.nodely.dev"
  ALGOD_PORT: "443"
  ALGOD_TOKEN: ""
---
# ---------------------------------------------------------------- MongoDB
# StatefulSet so kube-controller-manager creates the nfs-slow-retain PVC
# (`data-liquid-auth-stage-mongo-0`). A standalone PVC is easy to lose:
# storageClassName is immutable, kubectl apply still updates the Deployment
# after a failed PVC patch, and the scheduler then reports
# persistentvolumeclaim "…" not found.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: liquid-auth-stage-mongo
  namespace: awallet
spec:
  serviceName: liquid-auth-stage-mongo-service
  replicas: 1
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app: liquid-auth-stage-mongo
  template:
    metadata:
      labels:
        app: liquid-auth-stage-mongo
    spec:
      # Official mongo:7.0 entrypoint chowns /data/db when uid=0. nfs-slow-retain
      # is typically root_squash, so that chown fails with "Operation not permitted"
      # and the container never starts mongod. Run as the image's mongodb user
      # (uid/gid 999) so the entrypoint skips chown.
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: mongo
          image: mongo:7.0
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 999
            runAsGroup: 999
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          env:
            - name: MONGO_INITDB_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: liquid-auth-stage-conf
                  key: DB_NAME
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: liquid-auth-stage-secrets
                  key: DB_USERNAME
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: liquid-auth-stage-secrets
                  key: DB_PASSWORD
          ports:
            - containerPort: 27017
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: 27017
            initialDelaySeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 27017
            initialDelaySeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /data/db
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: nfs-slow-retain
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: liquid-auth-stage-mongo-service
  namespace: awallet
spec:
  type: ClusterIP
  selector:
    app: liquid-auth-stage-mongo
  ports:
    - name: mongo
      protocol: TCP
      port: 27017
      targetPort: 27017
---
# ---------------------------------------------------------------- Redis
apiVersion: apps/v1
kind: Deployment
metadata:
  name: liquid-auth-stage-redis-deployment
  namespace: awallet
spec:
  selector:
    matchLabels:
      app: liquid-auth-stage-redis
  replicas: 1
  template:
    metadata:
      labels:
        app: liquid-auth-stage-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: liquid-auth-stage-secrets
                  key: REDIS_PASSWORD
          # Pub/sub + socket.io adapter only; nothing worth persisting.
          # requirepass must match the app's REDIS_PASSWORD (see liquid-auth env).
          command: ["sh", "-c"]
          args:
            - exec redis-server --save "" --appendonly no --requirepass "$REDIS_PASSWORD"
          ports:
            - containerPort: 6379
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 2
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: liquid-auth-stage-redis-service
  namespace: awallet
spec:
  type: ClusterIP
  selector:
    app: liquid-auth-stage-redis
  ports:
    - name: redis
      protocol: TCP
      port: 6379
      targetPort: 6379
---
# ---------------------------------------------------------------- Liquid Auth API
apiVersion: apps/v1
kind: Deployment
metadata:
  name: liquid-auth-stage-deployment
  namespace: awallet
spec:
  selector:
    matchLabels:
      app: liquid-auth-stage
  replicas: 1
  template:
    metadata:
      labels:
        app: liquid-auth-stage
    spec:
      # NestFactory.create() + RedisIoAdapter.connectToRedis() happen before
      # app.listen(3000). Without these waits the API process sits on a closed
      # Mongo/Redis socket; the old 15s liveness probe then SIGTERMs it
      # (`npm error signal SIGTERM`) before it ever binds the port.
      initContainers:
        - name: wait-for-mongo
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z liquid-auth-stage-mongo-service 27017; do echo waiting for mongo; sleep 2; done
        - name: wait-for-redis
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z liquid-auth-stage-redis-service 6379; do echo waiting for redis; sleep 2; done
      containers:
        - name: liquid-auth
          image: ghcr.io/algorandfoundation/liquid-auth:develop
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: liquid-auth-stage-conf
          env:
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: liquid-auth-stage-secrets
                  key: SESSION_SECRET
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: liquid-auth-stage-secrets
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: liquid-auth-stage-secrets
                  key: DB_PASSWORD
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: liquid-auth-stage-secrets
                  key: REDIS_PASSWORD
          ports:
            - containerPort: 3000
              protocol: TCP
          # startupProbe gates liveness until Nest has bound :3000 (Mongo
          # auth + Redis AUTH can take well over the old 15s liveness window).
          startupProbe:
            tcpSocket:
              port: 3000
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 36
          readinessProbe:
            tcpSocket:
              port: 3000
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 3000
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: liquid-auth-stage-service
  namespace: awallet
spec:
  type: ClusterIP
  selector:
    app: liquid-auth-stage
  ports:
    - name: http
      protocol: TCP
      appProtocol: http
      port: 3000
      targetPort: 3000
---
# REST routes (/attestation, /assertion, /auth, …). Only the wallet calls these, cross-origin
# from the stage wallet hosts with credentials, and the stock server does not enable CORS itself,
# so the ingress adds it. Kept on a separate Ingress from /socket.io because socket.io sends
# its own CORS headers and a second Access-Control-Allow-Origin would break every client.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: stage-liquid-biatec-io-api
  namespace: awallet
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    cert-manager.io/cluster-issuer: letsencrypt
    nginx.ingress.kubernetes.io/enable-cors: "true"
    # All stage Biatec Wallet hosts (edit this list when a stage wallet host is added/removed).
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://stage.wallet.biatec.io, https://main.wallet.biatec.io, https://dev.wallet.biatec.io, https://test.wallet.biatec.io"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "Content-Type, Accept"
    nginx.ingress.kubernetes.io/cors-max-age: "600"
    # Add the Secure flag to the session cookie at the edge (see SESSION_SECURE above).
    # Requires `allow-snippet-annotations: "true"` in the ingress-nginx ConfigMap; if the
    # cluster forbids snippets, drop this annotation — the cookie stays Lax + HttpOnly and
    # is only ever exchanged over TLS anyway.
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_cookie_flags ~ secure;
spec:
  tls:
    - hosts:
        - stage.liquid.biatec.io
      secretName: stage.liquid.biatec.io
  rules:
    - host: stage.liquid.biatec.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: liquid-auth-stage-service
                port:
                  number: 3000
---
# WebSocket signaling. Any dApp origin connects here (socket.io allows origin '*' itself).
# Long-lived connections need the extended proxy timeouts; the cookie affinity keeps a client
# that falls back to HTTP long-polling on one pod.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: stage-liquid-biatec-io-socket
  namespace: awallet
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    cert-manager.io/cluster-issuer: letsencrypt
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/affinity: "cookie"
    nginx.ingress.kubernetes.io/session-cookie-name: "liquid-auth-stage-route"
    nginx.ingress.kubernetes.io/session-cookie-samesite: "None"
    nginx.ingress.kubernetes.io/session-cookie-secure: "true"
spec:
  tls:
    - hosts:
        - stage.liquid.biatec.io
      secretName: stage.liquid.biatec.io
  rules:
    - host: stage.liquid.biatec.io
      http:
        paths:
          - path: /socket.io
            pathType: Prefix
            backend:
              service:
                name: liquid-auth-stage-service
                port:
                  number: 3000
