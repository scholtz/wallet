# Liquid Auth service for Biatec Wallet — https://liquid.biatec.io
#
# The Algorand Foundation's Liquid Auth server (github.com/algorandfoundation/liquid-auth):
# passkey (FIDO2) authentication of wallets + WebRTC signaling between wallets and dApps.
# Biatec Wallet's "Connect → Liquid Auth" tab and the `biatecLiquid()` adapter in
# biatec-wallet-use-wallet-client both point at this service (see docs/LIQUID_AUTH.md).
#
# Why it lives under biatec.io: WebAuthn only lets wallet.biatec.io create passkeys for its own
# registrable domain, so RP ID (HOSTNAME) is `biatec.io` and ORIGIN is `https://wallet.biatec.io`.
#
# Prerequisites (out of band, like `regcred` for the wallet deployments):
#   kubectl create secret generic liquid-auth-secrets -n awallet \
#     --from-literal=SESSION_SECRET="$(openssl rand -hex 32)" \
#     --from-literal=DB_USERNAME=algorand \
#     --from-literal=DB_PASSWORD="$(openssl rand -hex 24)"
#   (or run k8s/liquid-auth-secrets.sh stable). Applied by .github/workflows/liquid-auth.yml
#   (Production environment, manual approval) or manually with k8s/update-liquid-auth.sh stable.
#   The stage twin is k8s/deployment-liquid-auth-stage.yaml (stage.liquid.biatec.io).
#
# Image: the upstream project only publishes `ghcr.io/algorandfoundation/liquid-auth:develop`
# (no release tags yet). Pin a digest, or mirror to scholtz2/liquid-auth, before relying on it.
apiVersion: v1
kind: Namespace
metadata:
  name: awallet
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: liquid-auth-conf
  namespace: awallet
data:
  NODE_ENV: "production"
  PORT: "3000"
  # FIDO2 relying party. HOSTNAME = RP ID (registrable domain of the wallet page),
  # ORIGIN = the exact origin passkeys are created from. www.wallet.biatec.io is NOT
  # accepted (the server checks a single expected origin) — use wallet.biatec.io.
  RP_NAME: "Biatec Wallet"
  HOSTNAME: "biatec.io"
  ORIGIN: "https://wallet.biatec.io"
  # TLS terminates at the ingress and the app does not trust the proxy, so express-session
  # must not insist on a secure connection itself; the `Secure` cookie flag is added by the
  # ingress (proxy_cookie_flags) below.
  SESSION_SECURE: "false"
  ENABLE_INDEX_PAGE: "false"
  # MongoDB (sessions, users, passkeys) and Redis (socket.io adapter + auth events)
  DB_HOST: "liquid-auth-mongo-service:27017"
  DB_NAME: "liquid"
  DB_ATLAS: "false"
  REDIS_HOST: "liquid-auth-redis-service"
  REDIS_PORT: "6379"
  REDIS_USERNAME: "default"
  REDIS_PASSWORD: ""
  # Used to resolve rekeyed accounts when verifying the account signature over the challenge.
  ALGOD_SERVER: "https://mainnet-api.4160.nodely.dev"
  ALGOD_PORT: "443"
  ALGOD_TOKEN: ""
---
# ---------------------------------------------------------------- MongoDB
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: liquid-auth-mongo-data
  namespace: awallet
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: liquid-auth-mongo-deployment
  namespace: awallet
spec:
  selector:
    matchLabels:
      app: liquid-auth-mongo
  replicas: 1
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: liquid-auth-mongo
    spec:
      containers:
        - name: mongo
          image: mongo:7.0
          imagePullPolicy: IfNotPresent
          env:
            - name: MONGO_INITDB_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: liquid-auth-conf
                  key: DB_NAME
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: liquid-auth-secrets
                  key: DB_USERNAME
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: liquid-auth-secrets
                  key: DB_PASSWORD
          ports:
            - containerPort: 27017
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: 27017
            initialDelaySeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 27017
            initialDelaySeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /data/db
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: liquid-auth-mongo-data
---
apiVersion: v1
kind: Service
metadata:
  name: liquid-auth-mongo-service
  namespace: awallet
spec:
  type: ClusterIP
  selector:
    app: liquid-auth-mongo
  ports:
    - name: mongo
      protocol: TCP
      port: 27017
      targetPort: 27017
---
# ---------------------------------------------------------------- Redis
apiVersion: apps/v1
kind: Deployment
metadata:
  name: liquid-auth-redis-deployment
  namespace: awallet
spec:
  selector:
    matchLabels:
      app: liquid-auth-redis
  replicas: 1
  template:
    metadata:
      labels:
        app: liquid-auth-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          # Pub/sub + socket.io adapter only; nothing worth persisting.
          args: ["--save", "", "--appendonly", "no"]
          ports:
            - containerPort: 6379
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 2
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: liquid-auth-redis-service
  namespace: awallet
spec:
  type: ClusterIP
  selector:
    app: liquid-auth-redis
  ports:
    - name: redis
      protocol: TCP
      port: 6379
      targetPort: 6379
---
# ---------------------------------------------------------------- Liquid Auth API
apiVersion: apps/v1
kind: Deployment
metadata:
  name: liquid-auth-deployment
  namespace: awallet
spec:
  selector:
    matchLabels:
      app: liquid-auth
  # Safe to scale: sessions live in MongoDB and socket.io uses the Redis adapter.
  replicas: 2
  template:
    metadata:
      labels:
        app: liquid-auth
    spec:
      containers:
        - name: liquid-auth
          image: ghcr.io/algorandfoundation/liquid-auth:develop
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: liquid-auth-conf
          env:
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: liquid-auth-secrets
                  key: SESSION_SECRET
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: liquid-auth-secrets
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: liquid-auth-secrets
                  key: DB_PASSWORD
          ports:
            - containerPort: 3000
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 5
            timeoutSeconds: 5
            failureThreshold: 2
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 15
            timeoutSeconds: 5
            failureThreshold: 2
            terminationGracePeriodSeconds: 1
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: liquid-auth-service
  namespace: awallet
spec:
  type: ClusterIP
  selector:
    app: liquid-auth
  ports:
    - name: http
      protocol: TCP
      appProtocol: http
      port: 3000
      targetPort: 3000
---
# REST routes (/attestation, /assertion, /auth, …). Only the wallet calls these, cross-origin
# from wallet.biatec.io with credentials, and the stock server does not enable CORS itself,
# so the ingress adds it. Kept on a separate Ingress from /socket.io because socket.io sends
# its own CORS headers and a second Access-Control-Allow-Origin would break every client.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: liquid-biatec-io-api
  namespace: awallet
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    cert-manager.io/cluster-issuer: letsencrypt
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://wallet.biatec.io, https://www.wallet.biatec.io"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "Content-Type, Accept"
    nginx.ingress.kubernetes.io/cors-max-age: "600"
    # Add the Secure flag to the session cookie at the edge (see SESSION_SECURE above).
    # Requires `allow-snippet-annotations: "true"` in the ingress-nginx ConfigMap; if the
    # cluster forbids snippets, drop this annotation — the cookie stays Lax + HttpOnly and
    # is only ever exchanged over TLS anyway.
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_cookie_flags ~ secure;
spec:
  tls:
    - hosts:
        - liquid.biatec.io
      secretName: liquid.biatec.io
  rules:
    - host: liquid.biatec.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: liquid-auth-service
                port:
                  number: 3000
---
# WebSocket signaling. Any dApp origin connects here (socket.io allows origin '*' itself).
# Long-lived connections need the extended proxy timeouts; the cookie affinity keeps a client
# that falls back to HTTP long-polling on one pod.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: liquid-biatec-io-socket
  namespace: awallet
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    cert-manager.io/cluster-issuer: letsencrypt
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/affinity: "cookie"
    nginx.ingress.kubernetes.io/session-cookie-name: "liquid-auth-route"
    nginx.ingress.kubernetes.io/session-cookie-samesite: "None"
    nginx.ingress.kubernetes.io/session-cookie-secure: "true"
spec:
  tls:
    - hosts:
        - liquid.biatec.io
      secretName: liquid.biatec.io
  rules:
    - host: liquid.biatec.io
      http:
        paths:
          - path: /socket.io
            pathType: Prefix
            backend:
              service:
                name: liquid-auth-service
                port:
                  number: 3000
