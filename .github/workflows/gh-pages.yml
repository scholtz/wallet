name: Build and Deploy
on:
  push:
    branches:
      - master
# Least privilege: the job only pushes the gh-pages branch (AW-2026-091).
permissions:
  contents: write
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: "26.x"
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"

      - name: pnpm install 🔧 # Install
        run: |
          pnpm install --frozen-lockfile
      - name: pnpm run build 🔧 # Build
        run: |
          pnpm run build
      - name: pnpm run test:unit 🔧 # Unit tests (E2E runs in the E2E Tests workflow)
        run: |
          pnpm run test:unit

      - name: Deploy 🚀 # Deploy to gh-pages branch
        # Third-party action: pinned to the commit of v4.9.0, not to a movable tag (AW-2026-091).
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445
        with:
          branch: gh-pages # The branch the action should deploy to.
          folder: dist # The folder the action should deploy.

