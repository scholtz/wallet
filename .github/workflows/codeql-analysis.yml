name: "CodeQL"

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "15 13 * * 3"
  workflow_dispatch:

# Cancel superseded runs on the same ref (saves minutes on rapid pushes to PRs).
concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default; the job below adds only what CodeQL needs.
permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          # JavaScript and TypeScript (the Vue SPA in src/) share one extractor.
          - language: javascript-typescript
            build-mode: none
          # Scans the workflow files themselves (script injection, unpinned
          # permissions, ...).
          - language: actions
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # security-extended adds lower-precision security queries on top of
          # the default suite; still no code-quality noise.
          queries: security-extended
          config: |
            paths-ignore:
              - node_modules
              - dist
              - playwright-report
              - test-results

      # No Autobuild step: JS/TS and Actions use build-mode "none", so CodeQL
      # reads the sources directly and does not need pnpm/Node set up here.

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
