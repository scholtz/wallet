name: Deploy Liquid Auth service

# Two-stage pipeline for the Liquid Auth service (see k8s/README.md → "Liquid Auth service"):
#
#   deploy-stage      (environment Stage)      -> https://stage.liquid.biatec.io   automatic
#   deploy-production (environment Production) -> https://liquid.biatec.io         waits for
#                                                                                   the required
#                                                                                   reviewer
#
# Runs whenever one of the Liquid Auth manifests (or this workflow) changes on master, or on
# demand. Production only starts after Stage succeeded and a reviewer approved the run.

on:
  push:
    branches: [master]
    paths:
      - k8s/deployment-liquid-auth-stage.yaml
      - k8s/deployment-liquid-auth-stable.yaml
      - .github/workflows/liquid-auth.yml
  workflow_dispatch:
    inputs:
      deploy_production:
        description: "Also deploy to Production (liquid.biatec.io) after Stage succeeds"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  deploy-stage:
    name: "Stage: deploy stage.liquid.biatec.io"
    runs-on: ubuntu-latest
    environment: Stage
    env:
      MANIFEST: k8s/deployment-liquid-auth-stage.yaml
      SECRET_NAME: liquid-auth-stage-secrets
      DEPLOYMENT: liquid-auth-stage-deployment
      REDIS_DEPLOYMENT: liquid-auth-stage-redis-deployment
      MONGO_STATEFULSET: liquid-auth-stage-mongo
      URL: https://stage.liquid.biatec.io
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p "$RUNNER_TEMP/.kube"
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > "$RUNNER_TEMP/.kube/config"
          chmod 600 "$RUNNER_TEMP/.kube/config"
          echo "KUBECONFIG=$RUNNER_TEMP/.kube/config" >> "$GITHUB_ENV"

      - name: Sync liquid-auth secrets
        # Upserts the k8s Secret from the environment secrets (create or replace all keys).
        # SESSION_SECRET rotation logs every wallet out of the service; DB_PASSWORD only
        # takes effect on a fresh MongoDB volume (MongoDB keeps the root password it was
        # initialised with); REDIS_PASSWORD takes effect on the next Redis restart -- see
        # k8s/README.md.
        run: |
          set -euo pipefail
          if [ -z "${{ secrets.LIQUID_AUTH_SESSION_SECRET }}" ] || [ -z "${{ secrets.LIQUID_AUTH_DB_PASSWORD }}" ] || [ -z "${{ secrets.LIQUID_AUTH_REDIS_PASSWORD }}" ]; then
            echo "::error::LIQUID_AUTH_SESSION_SECRET, LIQUID_AUTH_DB_PASSWORD and LIQUID_AUTH_REDIS_PASSWORD must be set as environment secrets"
            exit 1
          fi
          kubectl create secret generic "$SECRET_NAME" -n awallet \
            --from-literal=SESSION_SECRET="${{ secrets.LIQUID_AUTH_SESSION_SECRET }}" \
            --from-literal=DB_USERNAME="${{ secrets.LIQUID_AUTH_DB_USERNAME || 'algorand' }}" \
            --from-literal=DB_PASSWORD="${{ secrets.LIQUID_AUTH_DB_PASSWORD }}" \
            --from-literal=REDIS_PASSWORD="${{ secrets.LIQUID_AUTH_REDIS_PASSWORD }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Clear stray probe handlers
        # Same safeguard as the wallet workflows (k8s/README.md): a probe handler added
        # out-of-band would make `kubectl apply` fail with "may not specify more than 1 handler".
        run: |
          for d in liquid-auth-stage-redis-deployment:redis \
                   liquid-auth-stage-deployment:liquid-auth; do
            deployment="${d%%:*}"
            container="${d##*:}"
            kubectl patch deployment "$deployment" -n awallet --type strategic -p \
              "{\"spec\":{\"template\":{\"spec\":{\"containers\":[{\"name\":\"$container\",\"readinessProbe\":{\"httpGet\":null,\"exec\":null,\"grpc\":null},\"livenessProbe\":{\"httpGet\":null,\"exec\":null,\"grpc\":null}}]}}}}" \
              2>/dev/null || true
          done
          kubectl patch statefulset liquid-auth-stage-mongo -n awallet --type strategic -p \
            '{"spec":{"template":{"spec":{"containers":[{"name":"mongo","readinessProbe":{"httpGet":null,"exec":null,"grpc":null},"livenessProbe":{"httpGet":null,"exec":null,"grpc":null}}]}}}}' \
            2>/dev/null || true

      - name: Apply manifest
        run: |
          # Drop the pre-StatefulSet Mongo Deployment: kubectl apply does not delete
          # removed resources, and that Deployment still mounts liquid-auth-stage-mongo-data
          # (the missing PVC that pending-schedules as "not found").
          kubectl delete deployment liquid-auth-stage-mongo-deployment -n awallet --ignore-not-found
          kubectl apply -f "$MANIFEST" -n awallet

      - name: Roll out
        run: |
          kubectl rollout status statefulset/"$MONGO_STATEFULSET" -n awallet --timeout=300s
          # Redis reads REDIS_PASSWORD only at process start; restart it after the secret
          # upsert so requirepass matches the API before Nest connects.
          kubectl rollout restart deployment/"$REDIS_DEPLOYMENT" -n awallet
          kubectl rollout status deployment/"$REDIS_DEPLOYMENT" -n awallet --timeout=120s
          kubectl rollout restart deployment/"$DEPLOYMENT" -n awallet
          kubectl rollout status deployment/"$DEPLOYMENT" -n awallet --timeout=300s

      - name: Smoke test
        run: |
          set -euo pipefail
          for i in $(seq 1 12); do
            if curl -fsS --max-time 10 "$URL/auth/session" >/tmp/session.json; then
              echo "OK: $(head -c 300 /tmp/session.json)"
              exit 0
            fi
            echo "waiting for $URL ($i/12)..."
            sleep 10
          done
          echo "::error::$URL/auth/session did not answer"
          exit 1

  deploy-production:
    name: "Production: deploy liquid.biatec.io"
    needs: deploy-stage
    if: ${{ github.event_name == 'push' || inputs.deploy_production }}
    runs-on: ubuntu-latest
    # Production has a required-reviewer rule configured in repo settings, so this
    # job pauses for manual approval before it touches the live service.
    environment: Production
    env:
      MANIFEST: k8s/deployment-liquid-auth-stable.yaml
      SECRET_NAME: liquid-auth-secrets
      DEPLOYMENT: liquid-auth-deployment
      REDIS_DEPLOYMENT: liquid-auth-redis-deployment
      MONGO_STATEFULSET: liquid-auth-mongo
      URL: https://liquid.biatec.io
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p "$RUNNER_TEMP/.kube"
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > "$RUNNER_TEMP/.kube/config"
          chmod 600 "$RUNNER_TEMP/.kube/config"
          echo "KUBECONFIG=$RUNNER_TEMP/.kube/config" >> "$GITHUB_ENV"

      - name: Sync liquid-auth secrets
        run: |
          set -euo pipefail
          if [ -z "${{ secrets.LIQUID_AUTH_SESSION_SECRET }}" ] || [ -z "${{ secrets.LIQUID_AUTH_DB_PASSWORD }}" ] || [ -z "${{ secrets.LIQUID_AUTH_REDIS_PASSWORD }}" ]; then
            echo "::error::LIQUID_AUTH_SESSION_SECRET, LIQUID_AUTH_DB_PASSWORD and LIQUID_AUTH_REDIS_PASSWORD must be set as environment secrets"
            exit 1
          fi
          kubectl create secret generic "$SECRET_NAME" -n awallet \
            --from-literal=SESSION_SECRET="${{ secrets.LIQUID_AUTH_SESSION_SECRET }}" \
            --from-literal=DB_USERNAME="${{ secrets.LIQUID_AUTH_DB_USERNAME || 'algorand' }}" \
            --from-literal=DB_PASSWORD="${{ secrets.LIQUID_AUTH_DB_PASSWORD }}" \
            --from-literal=REDIS_PASSWORD="${{ secrets.LIQUID_AUTH_REDIS_PASSWORD }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Clear stray probe handlers
        run: |
          for d in liquid-auth-redis-deployment:redis \
                   liquid-auth-deployment:liquid-auth; do
            deployment="${d%%:*}"
            container="${d##*:}"
            kubectl patch deployment "$deployment" -n awallet --type strategic -p \
              "{\"spec\":{\"template\":{\"spec\":{\"containers\":[{\"name\":\"$container\",\"readinessProbe\":{\"httpGet\":null,\"exec\":null,\"grpc\":null},\"livenessProbe\":{\"httpGet\":null,\"exec\":null,\"grpc\":null}}]}}}}" \
              2>/dev/null || true
          done
          kubectl patch statefulset liquid-auth-mongo -n awallet --type strategic -p \
            '{"spec":{"template":{"spec":{"containers":[{"name":"mongo","readinessProbe":{"httpGet":null,"exec":null,"grpc":null},"livenessProbe":{"httpGet":null,"exec":null,"grpc":null}}]}}}}' \
            2>/dev/null || true

      - name: Apply manifest
        run: |
          kubectl delete deployment liquid-auth-mongo-deployment -n awallet --ignore-not-found
          kubectl apply -f "$MANIFEST" -n awallet

      - name: Roll out
        run: |
          kubectl rollout status statefulset/"$MONGO_STATEFULSET" -n awallet --timeout=300s
          kubectl rollout restart deployment/"$REDIS_DEPLOYMENT" -n awallet
          kubectl rollout status deployment/"$REDIS_DEPLOYMENT" -n awallet --timeout=120s
          kubectl rollout restart deployment/"$DEPLOYMENT" -n awallet
          kubectl rollout status deployment/"$DEPLOYMENT" -n awallet --timeout=300s

      - name: Smoke test
        run: |
          set -euo pipefail
          for i in $(seq 1 12); do
            if curl -fsS --max-time 10 "$URL/auth/session" >/tmp/session.json; then
              echo "OK: $(head -c 300 /tmp/session.json)"
              exit 0
            fi
            echo "waiting for $URL ($i/12)..."
            sleep 10
          done
          echo "::error::$URL/auth/session did not answer"
          exit 1
